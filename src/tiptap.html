<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Vellix TipTap</title>
    <style>
      :root {
        color: #f7f7f7;
        background: transparent;
        font-family:
          ui-rounded,
          -apple-system-rounded,
          "SF Pro Rounded",
          "SF Pro Display",
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        --vellix-page-background: transparent;
        --vellix-primary-text: #f7f7f7;
        --vellix-secondary-text: #9b9b9f;
        --vellix-font-family:
          ui-rounded,
          -apple-system-rounded,
          "SF Pro Rounded",
          "SF Pro Display",
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        --vellix-selection-fill: #0d5668;
        --vellix-selection-dot: #2ecbff;
        --vellix-icon-chevright: url("vellix-icon://asset/chevright");
        --vellix-icon-chevdown: url("vellix-icon://asset/chevdown");
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #editor-root {
        width: 100%;
        min-width: 100%;
        height: auto !important;
        min-height: 0 !important;
        margin: 0;
        padding: 0;
        background: transparent !important;
        overflow: visible !important;
        overscroll-behavior: none;
      }

      body {
        color: var(--vellix-primary-text);
        font-family: var(--vellix-font-family) !important;
        -webkit-text-size-adjust: 100%;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      .vellix-editor-shell,
      .vellix-editor-page {
        width: 100%;
        height: auto !important;
        min-height: 0 !important;
        margin: 0;
        padding: 0;
        background: transparent !important;
        color: var(--vellix-primary-text);
        font-family: var(--vellix-font-family) !important;
        overflow: visible !important;
      }

      .tiptap-editor,
      .tiptap-editor *,
      .ProseMirror,
      .ProseMirror * {
        font-family: var(--vellix-font-family) !important;
      }

      .tiptap-editor,
      .ProseMirror {
        height: auto !important;
        min-height: 0 !important;
        padding: 0 !important;
        background: transparent !important;
        color: var(--vellix-primary-text) !important;
        overflow: visible !important;
        caret-color: var(--vellix-primary-text);
        outline: none;
      }

      .tiptap-editor {
        font-size: 16px !important;
        line-height: 1.52 !important;
        padding-bottom: 1px !important;
      }

      .tiptap-editor [data-vellix-block-id] {
        position: relative;
        width: 100%;
        color: var(--vellix-primary-text);
        transition: none !important;
        touch-action: pan-y;
      }

      .tiptap-editor p,
      .tiptap-editor li,
      .tiptap-editor blockquote,
      .tiptap-editor h1,
      .tiptap-editor h2,
      .tiptap-editor h3,
      .tiptap-editor h4,
      .tiptap-editor h5,
      .tiptap-editor h6 {
        margin: 0;
        padding: 2px 0;
      }

      .tiptap-editor [data-vellix-align="left"] {
        text-align: left;
      }

      .tiptap-editor [data-vellix-align="center"] {
        text-align: center;
      }

      .tiptap-editor [data-vellix-align="right"] {
        text-align: right;
      }

      .tiptap-editor [data-vellix-indent="1"] {
        margin-left: 18px;
      }

      .tiptap-editor [data-vellix-indent="2"] {
        margin-left: 36px;
      }

      .tiptap-editor [data-vellix-indent="3"] {
        margin-left: 54px;
      }

      .tiptap-editor [data-vellix-indent="4"] {
        margin-left: 72px;
      }

      .tiptap-editor [data-vellix-indent="5"] {
        margin-left: 90px;
      }

      .tiptap-editor [data-vellix-indent="6"] {
        margin-left: 108px;
      }

      .tiptap-editor h1,
      .tiptap-editor h2,
      .tiptap-editor h3,
      .tiptap-editor h4,
      .tiptap-editor h5,
      .tiptap-editor h6 {
        font-family: var(--vellix-font-family) !important;
        font-weight: 800;
        letter-spacing: 0 !important;
        line-height: 1.24 !important;
      }

      .tiptap-editor h1 { font-size: 1.54em; }
      .tiptap-editor h2 { font-size: 1.44em; }
      .tiptap-editor h3 { font-size: 1.34em; }
      .tiptap-editor h4,
      .tiptap-editor h5,
      .tiptap-editor h6 { font-size: 1.22em; }

      @media (max-width: 700px) {
        .tiptap-editor {
          font-size: 15.5px !important;
        }

        .tiptap-editor p,
        .tiptap-editor li,
        .tiptap-editor blockquote,
        .tiptap-editor h1,
        .tiptap-editor h2,
        .tiptap-editor h3,
        .tiptap-editor h4,
        .tiptap-editor h5,
        .tiptap-editor h6 {
          padding: 1.5px 0;
        }
      }

      ::selection {
        background: rgb(128 0 254 / 35%);
      }

      .tiptap-editor a {
        color: #8fe9ff;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      .tiptap-editor blockquote {
        position: relative;
        margin: 10px 0 10px 2px !important;
        padding: 4px 0 4px 16px !important;
        color: var(--vellix-primary-text);
        font-style: normal;
        background: transparent !important;
        border: 0 !important;
      }

      .tiptap-editor blockquote::before {
        position: absolute;
        inset: 3px auto 3px 0;
        width: 3px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--vellix-primary-text) 62%, transparent);
        content: "";
      }

      .tiptap-editor code {
        padding: 0.12em 0.35em;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.12);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
        font-size: 0.92em;
      }

      .vellix-callout {
        --vellix-callout-color: #ffffff;
        box-sizing: border-box;
        position: relative;
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr);
        align-items: center;
        gap: 11px;
        width: 100%;
        max-width: none;
        margin: 10px 0;
        padding: 8px 10px;
        min-height: 58px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 22px;
      }

      .vellix-callout-icon-button {
        appearance: none;
        -webkit-appearance: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        margin: 0;
        padding: 8px;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.10);
        border: 0;
        border-radius: 17px;
        color: #ffffff;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
      }

      .vellix-callout-icon-button:hover {
        background: rgba(255, 255, 255, 0.16);
      }

      .vellix-callout-icon-image {
        display: block;
        width: 100%;
        height: 100%;
        margin: 0;
        border-radius: 0;
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        pointer-events: none;
      }

      .vellix-callout-icon-image[hidden] {
        display: none;
      }

      .vellix-callout-text {
        min-width: 0;
        max-width: 100%;
        color: var(--vellix-primary-text);
        outline: none;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .vellix-callout-text p {
        margin: 0;
        max-width: 100%;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .vellix-callout-text p + p {
        margin-top: 6px;
      }

      .tiptap-editor ul,
      .tiptap-editor ol {
        margin: 4px 0;
        padding-left: 24px;
      }

      .tiptap-editor [data-type="taskList"] {
        margin: 4px 0;
        padding-left: 0;
        list-style: none;
      }

      .tiptap-editor [data-type="taskItem"] {
        display: flex;
        align-items: center;
        min-height: 24px;
        list-style: none;
      }

      .tiptap-editor [data-type="taskItem"] > label {
        display: inline-flex;
        align-items: center;
        margin-right: 10px;
      }

      .tiptap-editor [data-type="taskItem"] input {
        width: 19px !important;
        min-width: 19px !important;
        height: 19px !important;
        margin: 0 !important;
        appearance: none !important;
        -webkit-appearance: none !important;
        cursor: pointer;
        background: transparent !important;
        border: 2px solid color-mix(in srgb, var(--vellix-primary-text) 42%, transparent) !important;
        border-radius: 50% !important;
        box-shadow: none !important;
      }

      .tiptap-editor [data-type="taskItem"] input:checked {
        background: var(--vellix-selection-dot) !important;
        border-color: var(--vellix-selection-dot) !important;
        box-shadow: inset 0 0 0 4px #050606 !important;
      }

      .tiptap-editor hr[data-vellix-divider] {
        margin: 18px 0 !important;
        border: 0 !important;
        border-top: 1px solid #ffffff1a !important;
      }

      .tiptap-editor [data-vellix-page-break] {
        height: 32px !important;
        margin: 12px 0 !important;
        background: #20202080;
        border: 1px solid #ffffff14 !important;
        border-radius: 28px;
        box-shadow: 0 12px 28px #00000029;
      }

      .tiptap-editor details[data-vellix-toggle] {
        position: relative;
        margin: 10px 0;
        padding: 8px 10px;
        min-height: 58px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 22px;
      }

      .tiptap-editor details[data-vellix-toggle] > summary {
        position: relative;
        width: 42px;
        height: 42px;
        margin: 0 11px 0 0;
        color: #fff;
        background: rgb(255 255 255 / 10%);
        border: 0;
        border-radius: 17px;
        list-style: none;
        cursor: pointer;
        float: left;
      }

      .tiptap-editor details[data-vellix-toggle] > summary::-webkit-details-marker {
        display: none;
      }

      .tiptap-editor details[data-vellix-toggle] > summary::before {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 18px;
        height: 18px;
        background: currentColor;
        -webkit-mask-image: var(--vellix-icon-chevright);
        mask-image: var(--vellix-icon-chevright);
        -webkit-mask-position: center;
        mask-position: center;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-size: contain;
        mask-size: contain;
        transform: translate(-50%, -50%);
        content: "";
      }

      .tiptap-editor details[data-vellix-toggle][open] > summary::before {
        -webkit-mask-image: var(--vellix-icon-chevdown);
        mask-image: var(--vellix-icon-chevdown);
      }

      .tiptap-editor details[data-vellix-toggle] > summary:active::before {
        -webkit-mask-image: var(--vellix-icon-chevup);
        mask-image: var(--vellix-icon-chevup);
      }

      .tiptap-editor .vellix-toggle-content {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .tiptap-editor pre {
        margin: 10px 0;
        padding: 12px 14px;
        overflow-x: auto;
        color: var(--vellix-primary-text);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 16px;
      }

      .vellix-slash-menu {
        position: fixed;
        z-index: 9999;
        width: min(320px, calc(100vw - 28px));
        max-height: min(430px, calc(100vh - 40px));
        padding: 8px;
        overflow-y: auto;
        color: #fff;
        background: rgba(30, 30, 30, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 22px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.44);
        -webkit-backdrop-filter: blur(24px);
        backdrop-filter: blur(24px);
      }

      .vellix-slash-menu[hidden] {
        display: none;
      }

      .vellix-slash-item {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        width: 100%;
        min-height: 52px;
        padding: 6px 8px;
        color: inherit;
        text-align: left;
        background: transparent;
        border: 0;
        border-radius: 16px;
      }

      .vellix-slash-item[data-active="true"] {
        background: rgba(255, 255, 255, 0.12);
      }

      .vellix-slash-icon {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        font-weight: 800;
        background: rgba(255, 255, 255, 0.10);
        border-radius: 14px;
      }

      .vellix-slash-title,
      .vellix-slash-detail {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .vellix-slash-title {
        font-size: 15px;
        font-weight: 750;
      }

      .vellix-slash-detail {
        margin-top: 2px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.55);
      }

      html:not(.vellix-selection-mode) .tiptap-editor,
      html:not(.vellix-selection-mode) .tiptap-editor [data-vellix-block-id] {
        -webkit-user-select: text !important;
        user-select: text !important;
      }

      .vellix-selection-mode .tiptap-editor {
        -webkit-user-select: none !important;
        user-select: none !important;
      }

      .vellix-selection-mode .tiptap-editor [data-vellix-block-id]::after {
        position: absolute;
        top: 50%;
        right: 6px;
        z-index: 3;
        width: 20px;
        height: 20px;
        pointer-events: none;
        background: transparent;
        border: 3px solid #202020;
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgb(0 0 0 / 50%);
        transform: translateY(-50%);
        content: "";
      }

      .vellix-selection-mode .vellix-selected-block::before,
      .vellix-selection-mode [data-vellix-selected="true"]::before {
        position: absolute;
        inset: 0 30px 0 0;
        z-index: -1;
        pointer-events: none;
        background: var(--vellix-selection-fill);
        border-radius: 8px;
        box-shadow: inset 0 0 0 1px rgb(46 203 255 / 20%);
        content: "";
      }

      .vellix-selection-mode .vellix-selected-block::after,
      .vellix-selection-mode [data-vellix-selected="true"]::after {
        background: var(--vellix-selection-dot) !important;
        border-color: var(--vellix-selection-dot) !important;
        box-shadow: none !important;
      }
    </style>
  </head>
  <body>
    <main id="editor-root" class="vellix-editor-shell">
      <div class="vellix-editor-page">
        <div id="editor"></div>
      </div>
    </main>
    <script src="./tiptap.bundle.js"></script>
  </body>
</html>
