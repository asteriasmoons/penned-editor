<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Vellix TipTap</title>
    <style>
      :root {
        color: #f7f7f7;
        background: transparent;
        font-family:
          ui-rounded,
          -apple-system-rounded,
          "SF Pro Rounded",
          "SF Pro Display",
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        --vellix-page-background: transparent;
        --vellix-primary-text: #f7f7f7;
        --vellix-secondary-text: #9b9b9f;
        --vellix-font-family:
          ui-rounded,
          -apple-system-rounded,
          "SF Pro Rounded",
          "SF Pro Display",
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        --vellix-selection-fill: #0d5668;
        --vellix-selection-dot: #2ecbff;
        --vellix-selection-soft: rgba(46, 203, 255, 0.12);
        --vellix-selection-softer: rgba(46, 203, 255, 0.075);
        --vellix-selection-edge: rgba(46, 203, 255, 0.28);
        --vellix-icon-chevright: url("vellix-icon://asset/chevright?tint=%23FFFFFF&size=22");
        --vellix-icon-chevdown: url("vellix-icon://asset/chevdown?tint=%23FFFFFF&size=22");
        --vellix-icon-chevup: url("vellix-icon://asset/chevup?tint=%23FFFFFF&size=22");
        --vellix-icon-checkwavy: url("vellix-icon://asset/checkwavy?tint=%23FFFFFF&size=22");
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #editor-root {
        width: 100%;
        min-width: 100%;
        height: auto !important;
        min-height: 0 !important;
        margin: 0;
        padding: 0;
        background: transparent !important;
        overflow: visible !important;
        overscroll-behavior: none;
      }

      body {
        color: var(--vellix-primary-text);
        font-family: var(--vellix-font-family) !important;
        -webkit-text-size-adjust: 100%;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      .vellix-editor-shell,
      .vellix-editor-page {
        width: 100%;
        height: auto !important;
        min-height: 0 !important;
        margin: 0;
        padding: 0;
        background: transparent !important;
        color: var(--vellix-primary-text);
        font-family: var(--vellix-font-family) !important;
        overflow: visible !important;
      }

      .tiptap-editor,
      .tiptap-editor *,
      .ProseMirror,
      .ProseMirror * {
        font-family: var(--vellix-font-family) !important;
      }

      .tiptap-editor,
      .ProseMirror {
        height: auto !important;
        min-height: 0 !important;
        padding: 0 !important;
        background: transparent !important;
        color: var(--vellix-primary-text) !important;
        overflow: visible !important;
        caret-color: var(--vellix-primary-text);
        outline: none;
      }

      .vellix-editor-page {
        max-width: 720px;
        margin: 0 auto;
      }

      .tiptap-editor {
        font-size: 15px;
        line-height: 1.52 !important;
        padding-bottom: 1px !important;
      }

      .tiptap-editor [data-vellix-block-id] {
        position: relative;
        width: 100%;
        color: var(--vellix-primary-text);
        transition: none !important;
        touch-action: pan-y;
      }

      .tiptap-editor [data-vellix-selection-block="true"] {
        position: relative;
        z-index: 0;
      }

      .tiptap-editor p,
      .tiptap-editor li,
      .tiptap-editor blockquote,
      .tiptap-editor h1,
      .tiptap-editor h2,
      .tiptap-editor h3,
      .tiptap-editor h4,
      .tiptap-editor h5,
      .tiptap-editor h6 {
        margin: 0;
        padding: 2px 0;
      }

      .tiptap-editor [data-vellix-align="left"] {
        text-align: left;
      }

      .tiptap-editor [data-vellix-align="center"] {
        text-align: center;
      }

      .tiptap-editor [data-vellix-align="right"] {
        text-align: right;
      }

      .tiptap-editor [data-vellix-indent="1"] {
        margin-left: 18px;
      }

      .tiptap-editor [data-vellix-indent="2"] {
        margin-left: 36px;
      }

      .tiptap-editor [data-vellix-indent="3"] {
        margin-left: 54px;
      }

      .tiptap-editor [data-vellix-indent="4"] {
        margin-left: 72px;
      }

      .tiptap-editor [data-vellix-indent="5"] {
        margin-left: 90px;
      }

      .tiptap-editor [data-vellix-indent="6"] {
        margin-left: 108px;
      }

      .tiptap-editor h1,
      .tiptap-editor h2,
      .tiptap-editor h3,
      .tiptap-editor h4,
      .tiptap-editor h5,
      .tiptap-editor h6 {
        font-family: var(--vellix-font-family) !important;
        font-weight: 800;
        letter-spacing: 0 !important;
        line-height: 1.24 !important;
      }

      .tiptap-editor h1 { font-size: 2.05em; }
      .tiptap-editor h2 { font-size: 1.62em; }
      .tiptap-editor h3 { font-size: 1.42em; }
      .tiptap-editor h4 { font-size: 1.28em; }
      .tiptap-editor h5 { font-size: 1.08em; }
      .tiptap-editor h6 { font-size: 1em; }

      @media (max-width: 700px) {
        .tiptap-editor {
          font-size: 14.5px;
        }

        .tiptap-editor p,
        .tiptap-editor li,
        .tiptap-editor blockquote,
        .tiptap-editor h1,
        .tiptap-editor h2,
        .tiptap-editor h3,
        .tiptap-editor h4,
        .tiptap-editor h5,
        .tiptap-editor h6 {
          padding: 1.5px 0;
        }
      }

      .tiptap-editor ::selection {
        background: rgb(128 0 254 / 35%);
      }

      .tiptap-editor a {
        color: #8fe9ff;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      .tiptap-editor blockquote {
        position: relative;
        margin: 10px 0 10px 2px !important;
        padding: 4px 0 4px 16px !important;
        color: var(--vellix-primary-text);
        font-style: normal;
        background: transparent !important;
        border: 0 !important;
      }

      .tiptap-editor blockquote::before {
        position: absolute;
        inset: 3px auto 3px 0;
        width: 3px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--vellix-primary-text) 62%, transparent);
        content: "";
      }

      .tiptap-editor code {
        padding: 0.12em 0.35em;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.12);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
        font-size: 0.92em;
      }

      .vellix-callout {
        --vellix-callout-color: #ffffff;
        box-sizing: border-box;
        position: relative;
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr);
        align-items: center;
        gap: 11px;
        width: 100%;
        max-width: none;
        margin: 10px 0;
        padding: 8px 10px;
        min-height: 58px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 22px;
      }

      .vellix-callout-icon-button {
        appearance: none;
        -webkit-appearance: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        margin: 0;
        padding: 8px;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.10);
        border: 0;
        border-radius: 17px;
        color: #ffffff;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
      }

      .vellix-callout-icon-button:hover {
        background: rgba(255, 255, 255, 0.16);
      }

      .vellix-callout-icon-image {
        display: block;
        width: 100%;
        height: 100%;
        margin: 0;
        border-radius: 0;
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        pointer-events: none;
      }

      .vellix-callout-icon-image[hidden] {
        display: none;
      }

      .vellix-callout-text {
        min-width: 0;
        max-width: 100%;
        color: var(--vellix-primary-text);
        outline: none;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .vellix-callout-text p {
        margin: 0;
        max-width: 100%;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .vellix-callout-text p + p {
        margin-top: 6px;
      }

      .tiptap-editor ul,
      .tiptap-editor ol {
        margin: 4px 0;
        padding-left: 24px;
      }

      .tiptap-editor [data-type="taskList"] {
        margin: 4px 0;
        padding-left: 0;
        list-style: none;
      }

      .tiptap-editor [data-type="taskItem"] {
        display: flex;
        align-items: flex-start;
        min-height: 30px;
        list-style: none;
        text-align: left !important;
      }

      /* Checklist: keep TipTap's native checkbox for state, but draw the
         visible control ourselves so iOS WebKit cannot repaint it as a system
         checkbox. */
      .tiptap-editor [data-type="taskItem"] > label {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        min-width: 22px;
        height: var(--vellix-task-first-line-height, 22px);
        min-height: var(--vellix-task-first-line-height, 22px);
        margin: 0 10px 0 0;
        padding: 0;
      }

      .tiptap-editor [data-type="taskItem"] > label input[type="checkbox"] {
        position: absolute !important;
        width: 1px !important;
        min-width: 1px !important;
        height: 1px !important;
        margin: 0 !important;
        padding: 0 !important;
        opacity: 0 !important;
        overflow: hidden !important;
        appearance: none !important;
        -webkit-appearance: none !important;
        background-image: none !important;
        border: 0 !important;
        box-shadow: none !important;
        outline: none !important;
        pointer-events: none !important;
      }

      .tiptap-editor [data-type="taskItem"] > label > span {
        position: static !important;
        display: block !important;
        flex: 0 0 19px !important;
        width: 19px !important;
        height: 19px !important;
        min-width: 19px !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        clip: auto !important;
        clip-path: none !important;
        white-space: nowrap !important;
        color: transparent !important;
        font-size: 0 !important;
        line-height: 0 !important;
        background-color: transparent !important;
        background-image: none !important;
        background-position: center !important;
        background-repeat: no-repeat !important;
        background-size: 13px 13px !important;
        border: 2px solid color-mix(in srgb, var(--vellix-primary-text) 55%, transparent) !important;
        border-radius: 50% !important;
        box-shadow: none !important;
        transition: background-color 120ms ease, border-color 120ms ease;
      }

      .tiptap-editor [data-type="taskItem"] > label input[type="checkbox"]:checked + span {
        background-color: var(--vellix-selection-dot) !important;
        background-image: var(--vellix-icon-checkwavy) !important;
        border-color: var(--vellix-selection-dot) !important;
      }

      .tiptap-editor [data-type="taskItem"] > div {
        min-width: 0;
        width: 100%;
        flex: 1 1 auto;
        display: block;
        min-height: var(--vellix-task-first-line-height, 22px);
        padding-top: 0;
        text-align: left !important;
      }

      .tiptap-editor [data-type="taskItem"] > div > p {
        margin: 0;
        padding: 0;
        width: 100%;
        max-width: 100%;
        line-height: var(--vellix-task-first-line-height, 22px) !important;
        text-align: left !important;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .tiptap-editor [data-vellix-divider] {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        min-height: 30px !important;
        margin: 4px 0 !important;
        border: 0 !important;
      }

      .tiptap-editor .vellix-divider-line {
        display: block;
        background: rgba(255, 255, 255, 0.18);
        border-radius: 999px;
      }

      .tiptap-editor [data-divider-style="thinLine"] .vellix-divider-line {
        width: 100%;
        height: 1px;
        background: linear-gradient(90deg, transparent, #ffffff24 10%, #ffffff24 90%, transparent);
      }

      .tiptap-editor [data-divider-style="thickLine"] .vellix-divider-line {
        width: min(86%, 520px);
        height: 8px;
        background: rgba(255, 255, 255, 0.2);
      }

      .tiptap-editor .vellix-divider-dots {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(88%, 560px);
      }

      .tiptap-editor .vellix-divider-dot {
        display: block;
        width: 5px;
        height: 5px;
        flex: 0 0 5px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.28);
      }

      .tiptap-editor .vellix-divider-four-circles {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }

      .tiptap-editor .vellix-divider-circle {
        display: block;
        width: 10px;
        height: 10px;
        flex: 0 0 10px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.34);
      }

      .tiptap-editor [data-vellix-page-break],
      .tiptap-editor [data-type="pageBreak"],
      .tiptap-editor [data-page-break] {
        display: block;
        width: 100%;
        height: 128px !important;
        margin: 28px 0 !important;
        padding: 0 !important;
        background: transparent !important;
        border: 0 !important;
        border-radius: 0;
        box-shadow: none !important;
        color: transparent !important;
        font-size: 0 !important;
        line-height: 0 !important;
        overflow: hidden;
      }

      .tiptap-editor [data-vellix-page-break] > *,
      .tiptap-editor [data-type="pageBreak"] > *,
      .tiptap-editor [data-page-break] > * {
        display: none !important;
      }

      .tiptap-editor [data-vellix-toggle] {
        position: relative;
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        align-items: start;
        column-gap: 8px;
        margin: 10px 0;
        padding: 2px 0;
        min-height: 32px;
        background: transparent;
        border: 0;
        border-radius: 0;
      }

      .tiptap-editor .vellix-toggle-button {
        appearance: none;
        -webkit-appearance: none;
        position: relative;
        grid-column: 1;
        width: 28px;
        height: 28px;
        margin: 1px 0 0;
        padding: 0;
        color: #fff;
        background: transparent;
        border: 0;
        border-radius: 12px;
        list-style: none;
        cursor: pointer;
      }

      .tiptap-editor .vellix-toggle-button::before {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        background-image: var(--vellix-asset-chevright, var(--vellix-icon-chevright));
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        transform: translate(-50%, -50%);
        content: "";
      }

      .tiptap-editor [data-vellix-toggle][data-open="true"] > .vellix-toggle-button::before {
        background-image: var(--vellix-asset-chevdown, var(--vellix-icon-chevdown));
      }

      .tiptap-editor .vellix-toggle-button:active::before {
        background-image: var(--vellix-asset-chevup, var(--vellix-icon-chevup));
      }

      .tiptap-editor .vellix-toggle-content {
        grid-column: 2;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .tiptap-editor .vellix-toggle-content > :first-child {
        margin-top: 0 !important;
      }

      .tiptap-editor .vellix-toggle-content > :last-child {
        margin-bottom: 0 !important;
      }

      .tiptap-editor [data-vellix-toggle][data-open="false"] > .vellix-toggle-content > :not(:first-child) {
        display: none;
      }

      .tiptap-editor pre {
        margin: 10px 0;
        padding: 12px 14px;
        overflow-x: auto;
        color: var(--vellix-primary-text);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 16px;
      }

      html:not(.vellix-selection-mode) .tiptap-editor,
      html:not(.vellix-selection-mode) .tiptap-editor [data-vellix-block-id] {
        -webkit-user-select: text !important;
        user-select: text !important;
      }

      .vellix-selection-mode .tiptap-editor {
        -webkit-user-select: none !important;
        user-select: none !important;
      }

      .vellix-selection-mode .tiptap-editor [data-vellix-selection-block="true"]::after {
        position: absolute;
        top: var(--vellix-selection-y, 50%);
        right: 9px;
        z-index: 3;
        width: 16px;
        height: 16px;
        pointer-events: none;
        background: transparent;
        border: 1.5px solid rgba(255, 255, 255, 0.32);
        border-radius: 50%;
        box-shadow: none;
        transform: translateY(-50%);
        transition: background-color 120ms ease, border-color 120ms ease;
        content: "";
      }

      .vellix-selection-mode .tiptap-editor .vellix-selected-text-decoration {
        padding: 0.06em 0.14em 0.08em;
        background: color-mix(in srgb, var(--vellix-selection-dot) 34%, transparent);
        border-radius: 4px;
        -webkit-box-decoration-break: clone;
        box-decoration-break: clone;
      }

      .vellix-selection-mode .tiptap-editor [data-type="taskItem"] .vellix-selected-text-decoration {
        margin-left: -3px;
        padding-left: 3px;
      }

      .vellix-selection-mode .tiptap-editor [data-vellix-selection-node-type="divider"][data-vellix-selected="true"] .vellix-divider-line {
        background: linear-gradient(
          90deg,
          transparent,
          rgba(46, 203, 255, 0.3) 12%,
          rgba(46, 203, 255, 0.42) 50%,
          rgba(46, 203, 255, 0.3) 88%,
          transparent
        );
        box-shadow: 0 0 8px rgba(46, 203, 255, 0.18);
      }

      .vellix-selection-mode .tiptap-editor [data-vellix-selection-node-type="divider"][data-divider-style="thinLine"][data-vellix-selected="true"] .vellix-divider-line {
        height: 2px;
      }

      .vellix-selection-mode .tiptap-editor [data-vellix-selection-node-type="divider"][data-divider-style="thickLine"][data-vellix-selected="true"] .vellix-divider-line {
        height: 8px;
      }

      .vellix-selection-mode .tiptap-editor [data-vellix-selection-node-type="divider"][data-vellix-selected="true"] .vellix-divider-dot,
      .vellix-selection-mode .tiptap-editor [data-vellix-selection-node-type="divider"][data-vellix-selected="true"] .vellix-divider-circle {
        background: rgba(46, 203, 255, 0.58);
        box-shadow: 0 0 8px rgba(46, 203, 255, 0.18);
      }

      .vellix-selection-mode .tiptap-editor [data-vellix-selection-block="true"][data-vellix-selected="true"]::after {
        background:
          radial-gradient(circle, rgba(18, 45, 56, 0.82) 0 3.25px, transparent 3.75px),
          var(--vellix-selection-dot) !important;
        border-color: var(--vellix-selection-dot) !important;
        box-shadow: 0 0 0 3px rgba(46, 203, 255, 0.1) !important;
      }
    </style>
  </head>
  <body>
    <main id="editor-root" class="vellix-editor-shell">
      <div class="vellix-editor-page">
        <div id="editor"></div>
      </div>
    </main>
    <script src="./tiptap.bundle.js"></script>
  </body>
</html>
